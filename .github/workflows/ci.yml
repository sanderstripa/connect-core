name: lab-checks
on:
  push:
    branches: [main, 'installer/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: go test -race -count=1 -v ./...
      - run: go vet ./...
      - run: go build ./cmd/connect-core
      - run: go build ./cmd/connect-control
      - run: go build ./cmd/connect-ui
      - run: python scripts/ip-lab-services.py self-check
      - run: go test ./internal/ipvpn -run '^$' -fuzz FuzzPacket -fuzztime=10s
      - run: go test ./internal/ipvpn -run '^$' -fuzz FuzzHello -fuzztime=10s
  ip-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: sudo apt-get update && sudo apt-get install -y iproute2 tcpdump
      - run: go build -o bin/connect-core ./cmd/connect-core
      - run: go build -o bin/connect-control ./cmd/connect-control
      - run: go build -o bin/connect-ui ./cmd/connect-ui
      - run: go test -c -o bin/ipvpn-native.test ./internal/ipvpn
      - run: sudo env CONNECT_LAB_NATIVE_TUN_TEST=1 bash scripts/tun-startup-linux.sh
      - run: sudo env CONNECT_LAB_ARTIFACTS="$PWD/ip-lab-artifacts" bash scripts/ip-lab-linux.sh
      - run: sudo env CONNECT_LAB_MANAGED=1 CONNECT_LAB_ARTIFACTS="$PWD/managed-lab-artifacts" bash scripts/ip-lab-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-ip-lab
          path: ip-lab-artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-ip-lab
          path: managed-lab-artifacts/
  panel-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go build -o bin/connect-core ./cmd/connect-core
      - run: go build -o bin/connect-control ./cmd/connect-control
      - run: go build -o bin/connect-ui ./cmd/connect-ui
      - run: npm install --no-save --ignore-scripts playwright@1.64.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ui-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connect-ui-browser
          path: ui-browser-artifacts/
  windows-tun:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: ./scripts/ip-lab-windows-ci.ps1
  vps-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iptables zbar-tools
      - run: python3 -m py_compile scripts/connect-install.py scripts/connect-vps-network.py scripts/installer-smoke.py
      - run: bash -n scripts/install-vps.sh
      - run: python3 scripts/installer-discovery-test.py
      - run: go build -o bin/connect-vps-probe ./scripts/vps-probe.go
      - run: sudo env GITHUB_ACTIONS=true CONNECT_DISPOSABLE_INSTALL_TEST=1 PATH="$PATH" bash scripts/installer-acme-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-acme-validation
          path: installer-acme/pebble.log
      - name: Owned service diagnostics
        if: failure()
        run: sudo journalctl -u connect-core.service -u connect-ui.service -u connect-core-network.service --no-pager -n 100
