name: Published server installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iptables zbar-tools
      - run: go build -o bin/connect-vps-probe ./scripts/vps-probe.go
      - run: sudo env GITHUB_ACTIONS=true CONNECT_DISPOSABLE_INSTALL_TEST=1 CONNECT_TEST_PUBLISHED_PACKAGE=1 PATH="$PATH" bash scripts/installer-acme-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-installer-acme
          path: installer-acme/pebble.log
      - name: Owned service diagnostics
        if: failure()
        run: sudo journalctl -u connect-core.service -u connect-ui.service -u connect-core-network.service --no-pager -n 100
