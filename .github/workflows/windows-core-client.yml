name: Windows Core Client
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w" -o dist/connect-desktop-core.exe ./cmd/connect-desktop-core
      - run: cmake -S apps/windows-core-client -B build/desktop -A x64
      - run: cmake --build build/desktop --config Release
      - run: Copy-Item build/desktop/Release/ConnectCore.exe dist/
      - run: ./scripts/desktop-smoke.ps1 -Directory dist
      - name: Include instructions, notices and checksums
        shell: pwsh
        run: |
          Copy-Item apps/windows-core-client/README.md dist/README.md
          Copy-Item THIRD-PARTY-NOTICES.md dist/
          Copy-Item third_party dist/third_party -Recurse
          Get-ChildItem dist/*.exe | ForEach-Object { $hash = Get-FileHash $_.FullName -Algorithm SHA256; "$($hash.Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ConnectCore-Windows-x64
          path: dist/
